<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人主页</title>
    <!-- 引入 https://remixicon.com/ 图标库 -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet" />
    <!-- 引入外部样式 -->
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- 卡片主体 -->
    <div id="card">
        <!-- 1. 头像 -->
        <div class="avatar-container">
            <img id="avatar-img" src="" alt="Avatar" class="avatar" />
        </div>

        <!-- 2. 介绍 -->
        <div class="intro-container">
            <h1 id="user-name" class="name"></h1>
            <p id="user-bio" class="bio"></p>
        </div>

        <!-- 3. 导航图标 -->
        <div id="nav-list" class="nav-container"></div>

        <!-- 4. 联系方式 -->
        <div id="contact-list" class="contact-container"></div>
    </div>

    <!-- 5. 底部版权 (新增) -->
    <div id="footer-text" class="footer"></div>

    <!-- 引入主逻辑脚本 -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
